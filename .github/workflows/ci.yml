name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false  # CI never pushes
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m compileall -q site pipeline collector deploy social
      - run: pip install -e "collector[dev]" -e "site[dev]" -r pipeline/requirements-test.txt flask paramiko
      - run: python -m pytest collector -q
      - run: python -m pytest site -q
      - run: python -m pytest pipeline/tests audit-site/tests deploy/tests social/tests -q

  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false  # CI never pushes
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
        working-directory: bot
      - run: npm test
        working-directory: bot

  site-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false  # CI never pushes
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: npm test
        working-directory: site

  social-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false  # CI never pushes
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: social/package-lock.json
      - run: npm ci
        working-directory: social
      - run: npm test
        working-directory: social

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false  # CI never pushes
      - name: every component has a real README
        run: |
          for d in collector site bot pipeline deploy audit-site social; do
            test -s "$d/README.md" || { echo "missing or empty $d/README.md"; exit 1; }
          done
          if find . -name 'PUBLIC_README.md' -print -quit | grep -q .; then
            echo "PUBLIC_README.md is a staging artefact; keep one README per component"
            exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false  # CI never pushes
          fetch-depth: 0   # gitleaks scans FULL history, not just the tip
      - name: gitleaks (history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: scan_secrets (working tree)
        run: python scripts/scan_secrets.py
      - name: scan_public_metadata (working tree)
        run: python scripts/scan_public_metadata.py
