name: Timetable candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timetable-candidate
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: timetable-build
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pipeline/requirements-runtime.txt
            pipeline/requirements-build.txt

      - name: Install pinned build dependencies
        run: python -m pip install --requirement pipeline/requirements-build.txt

      - name: Prepare disposable build directories
        run: |
          echo "BBB_BUILD_STARTED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/bbb-timetable-sources" >> "$GITHUB_ENV"
          echo "SQLITE_TMPDIR=$RUNNER_TEMP/bbb-sqlite" >> "$GITHUB_ENV"
          echo "BBB_TIMETABLE_DB=$RUNNER_TEMP/bbb-candidate/timetable.db" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/bbb-timetable-sources" "$RUNNER_TEMP/bbb-sqlite"
          mkdir -p "$RUNNER_TEMP/bbb-candidate" "$RUNNER_TEMP/timetable-package"

      - name: Build complete timetable candidate
        run: python pipeline/build_timetable.py --skip-deploy
        env:
          BODS_API_KEY: ${{ secrets.BODS_API_KEY }}
          TNDS_USER: ${{ secrets.TNDS_USER }}
          TNDS_PASS: ${{ secrets.TNDS_PASS }}
          # Planning #151: store each repeated journey's stop times once
          # (about 100 MiB instead of 526). Remove this line to go back.
          BBB_TIMETABLE_LAYOUT: shared

      - name: Run independent production validation
        run: python deploy/timetable_control.py validate "$BBB_TIMETABLE_DB"

      - name: Enforce the Pi delivery size limit before publishing
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path[:0] = ['deploy', 'pipeline']
          from timetable_delivery import MAX_DATABASE_BYTES
          size = Path(os.environ['BBB_TIMETABLE_DB']).stat().st_size
          if not 0 < size <= MAX_DATABASE_BYTES:
              raise SystemExit(f'timetable.db is {size} bytes; delivery limit is {MAX_DATABASE_BYTES}')
          print(f'timetable.db: {size} / {MAX_DATABASE_BYTES} bytes')
          PY

      - name: Create provenance manifest and service summary
        run: |
          python pipeline/timetable_manifest.py create \
            --database "$BBB_TIMETABLE_DB" \
            --output "$RUNNER_TEMP/timetable-package/manifest.json" \
            --gtfs "$TMPDIR/busaudit_gtfs" \
            --first-txc "$TMPDIR/busaudit_first_txc" \
            --tnds "$TMPDIR/busaudit_tnds" \
            --source-status "$TMPDIR/busaudit_timetable_source_status.json" \
            --builder-commit "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --build-started-utc "$BBB_BUILD_STARTED_UTC" \
            --minimum-service-days 14

      - name: Assemble and re-verify the exact artifact payload
        run: |
          cp "$BBB_TIMETABLE_DB" "$RUNNER_TEMP/timetable-package/timetable.db"
          cp pipeline/TIMETABLE_ARTIFACT_ATTRIBUTION.txt "$RUNNER_TEMP/timetable-package/"
          python pipeline/timetable_manifest.py verify \
            --database "$RUNNER_TEMP/timetable-package/timetable.db" \
            --manifest "$RUNNER_TEMP/timetable-package/manifest.json" \
            --minimum-service-days 14
          test "$(find "$RUNNER_TEMP/timetable-package" -maxdepth 1 -type f | wc -l)" -eq 4

      - name: Upload seven-day delivery artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bristolbusbot-timetable
          path: ${{ runner.temp }}/timetable-package/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
